name: Build & Release

# Combined Windows installer pipeline. Fires on a v* tag push to this
# repo. Consumes the *latest* GitHub release of:
#   - k10-motorsports/prodrive-plugin   (SimHub plugin assets)
#   - k10-motorsports/prodrive-overlay  (Electron HUD, win-x64 unpacked tree)
# Builds the WinUI 3 host from source, then runs Inno Setup to bundle
# the three pieces into one .exe and attaches it to a release on this
# repo.
#
# Required repository secrets:
#   CROSS_REPO_PAT  — PAT (or GitHub App token) with `contents:read`
#                     on prodrive-plugin and prodrive-overlay. The
#                     default GITHUB_TOKEN cannot download release
#                     assets from sibling private repos.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    name: Build Combined Installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Show .NET SDK in use
        shell: pwsh
        run: |
          Write-Host "dotnet --version:"
          dotnet --version
          Write-Host "dotnet --list-sdks:"
          dotnet --list-sdks
          Write-Host "which dotnet:"
          (Get-Command dotnet).Source

      # ─── Download latest plugin release ────────────────────────────
      - name: Download latest prodrive-plugin release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/plugin | Out-Null
          gh release download `
            --repo k10-motorsports/prodrive-plugin `
            --pattern "*.zip" `
            --dir artifacts/plugin
          # Unpack whatever zip the plugin release ships into a flat dir.
          $zip = Get-ChildItem artifacts/plugin/*.zip | Select-Object -First 1
          if (-not $zip) { throw "No plugin .zip found in latest release" }
          Expand-Archive -Path $zip.FullName -DestinationPath artifacts/plugin/unpacked -Force
          "PLUGIN_UNPACKED=$((Resolve-Path artifacts/plugin/unpacked).Path)" >> $env:GITHUB_ENV

      # ─── Download latest overlay release ───────────────────────────
      - name: Download latest prodrive-overlay release (win-x64)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/overlay | Out-Null
          gh release download `
            --repo k10-motorsports/prodrive-overlay `
            --pattern "overlay-win-unpacked.zip" `
            --dir artifacts/overlay
          Expand-Archive -Path artifacts/overlay/overlay-win-unpacked.zip `
            -DestinationPath artifacts/overlay/unpacked -Force
          "HUD_UNPACKED=$((Resolve-Path artifacts/overlay/unpacked).Path)" >> $env:GITHUB_ENV

      # ─── Workaround: drop System.Security.Permissions 6.0.0 next to
      # the in-process XAML compiler task so .NET 8 MSBuild can load it.
      - name: Restore + patch XAML compiler task deps
        shell: pwsh
        run: |
          dotnet restore src/RaceCorProDrive/RaceCorProDrive.csproj -p:RuntimeIdentifier=win-x64 -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "restore failed" }
          $compilerDll = Get-ChildItem -Recurse -Filter "Microsoft.UI.Xaml.Markup.Compiler.dll" -Path "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "tools\\net6\.0" } |
            Select-Object -First 1
          if (-not $compilerDll) { throw "Compiler DLL not found in nuget cache" }
          $toolsDir = $compilerDll.Directory.FullName
          Write-Host "WindowsAppSDK tools dir: $toolsDir"
          $sysPerms = Get-ChildItem -Recurse -Filter "System.Security.Permissions.dll" -Path "$env:USERPROFILE\.nuget\packages\system.security.permissions" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "6\.0\.0\\lib\\net6\.0" } |
            Select-Object -First 1
          if (-not $sysPerms) {
            Write-Host "System.Security.Permissions 6.0.0 not in cache; fetching"
            dotnet nuget push --help | Out-Null  # ensure dotnet is warm
            $tmpProj = New-TemporaryFile
            Remove-Item $tmpProj
            New-Item -ItemType Directory -Path $tmpProj | Out-Null
            Push-Location $tmpProj
            "<Project Sdk=""Microsoft.NET.Sdk""><PropertyGroup><TargetFramework>net6.0</TargetFramework></PropertyGroup><ItemGroup><PackageReference Include=""System.Security.Permissions"" Version=""6.0.0"" /></ItemGroup></Project>" | Set-Content "tmp.csproj"
            dotnet restore tmp.csproj
            Pop-Location
            $sysPerms = Get-ChildItem -Recurse -Filter "System.Security.Permissions.dll" -Path "$env:USERPROFILE\.nuget\packages\system.security.permissions" |
              Where-Object { $_.FullName -match "6\.0\.0\\lib\\net6\.0" } |
              Select-Object -First 1
          }
          if (-not $sysPerms) { throw "Could not obtain System.Security.Permissions 6.0.0" }
          Write-Host "Copying $($sysPerms.FullName) -> $toolsDir"
          Copy-Item -Force $sysPerms.FullName $toolsDir

      # ─── Publish WinUI host ────────────────────────────────────────
      - name: Publish native host
        shell: pwsh
        run: |
          $publishDir = (Join-Path (Get-Location) "src/RaceCorProDrive/publish/win-x64")
          Write-Host "Requested publish dir: $publishDir"
          dotnet publish src/RaceCorProDrive/RaceCorProDrive.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishReadyToRun=false `
            -p:PublishDir=$publishDir `
            -p:UseXamlCompilerExecutable=false `
            -v:detailed `
            -bl:publish.binlog
          $publishExitCode = $LASTEXITCODE
          if ($publishExitCode -ne 0) {
            Write-Host "::group::XAML compiler input/output dump"
            foreach ($obj in @("src/RaceCorProDrive/obj/Release/win-x64", "obj/Release/win-x64")) {
              foreach ($f in @("input.json","output.json")) {
                $p = Join-Path $obj $f
                if (Test-Path $p) {
                  Write-Host "==== ${p} ===="
                  Get-Content -Raw $p | Out-Host
                } else {
                  Write-Host "(not found: $p)"
                }
              }
            }
            Write-Host "::endgroup::"
            throw "dotnet publish failed ($publishExitCode)"
          }
          if (-not (Test-Path $publishDir)) {
            Write-Host "::group::Publish exited 0 but expected dir missing — searching workspace"
            Get-ChildItem -Recurse -Directory src/RaceCorProDrive |
              Where-Object { $_.Name -eq "publish" -or $_.FullName -match "publish" } |
              ForEach-Object { Write-Host "candidate: $($_.FullName)" }
            Write-Host "::endgroup::"
            throw "Host publish dir not found: $publishDir"
          }
          Write-Host "Publish dir contents:"
          Get-ChildItem $publishDir | Select-Object -First 20 | Format-Table Name, Length
          "HOST_PUBLISH=$publishDir" >> $env:GITHUB_ENV

      - name: Upload publish binlog on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publish-binlog
          path: publish.binlog
          if-no-files-found: ignore

      # ─── Inno Setup ────────────────────────────────────────────────
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          $iss = "installer/RaceCorProDrive.iss"
          & "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" `
            $iss `
            "/DAppVersion=${{ steps.version.outputs.VERSION }}" `
            "/DHOST_PUBLISH=$env:HOST_PUBLISH" `
            "/DHUD_UNPACKED=$env:HUD_UNPACKED" `
            "/DPLUGIN_UNPACKED=$env:PLUGIN_UNPACKED"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: installer/output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
