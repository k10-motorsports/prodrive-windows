name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  windows-tests:
    name: xUnit + Coverlet
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore test project
        shell: pwsh
        # WinUI host (referenced transitively) requires an explicit RID.
        # Without -p:Platform, MSBuild defaults Platform to AnyCPU and the
        # csproj derives win-AnyCPU (NETSDK1083). Mirror release.yml, which
        # always passes Platform + RuntimeIdentifier.
        run: dotnet restore tests/RaceCorProDrive.Tests/RaceCorProDrive.Tests.csproj -p:Platform=x64 -p:RuntimeIdentifier=win-x64

      - name: Run tests with coverage
        shell: pwsh
        run: |
          dotnet test tests/RaceCorProDrive.Tests/RaceCorProDrive.Tests.csproj `
            --configuration Release `
            --collect:"XPlat Code Coverage" `
            --settings tests/RaceCorProDrive.Tests/coverlet.runsettings `
            --results-directory TestResults `
            --logger "trx;LogFileName=test-results.trx" `
            -p:Platform=x64 -p:RuntimeIdentifier=win-x64

      - name: Locate coverage report
        id: coverage
        shell: pwsh
        run: |
          $cobertura = Get-ChildItem -Recurse -Path TestResults -Filter coverage.cobertura.xml | Select-Object -First 1
          if (-not $cobertura) { throw "coverage.cobertura.xml not found under TestResults" }
          Write-Host "Found: $($cobertura.FullName)"
          # Stage at a stable path the rest of the workflow can reference.
          New-Item -ItemType Directory -Force -Path coverage | Out-Null
          Copy-Item $cobertura.FullName coverage/cobertura-coverage.xml -Force
          "path=coverage/cobertura-coverage.xml" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Append coverage summary to job summary
        if: always()
        shell: pwsh
        run: |
          $xml = "coverage/cobertura-coverage.xml"
          if (Test-Path $xml) {
            [xml]$doc = Get-Content $xml
            $cov = $doc.coverage
            $lineRate = [math]::Round([double]$cov.'line-rate' * 100, 2)
            $branchRate = [math]::Round([double]$cov.'branch-rate' * 100, 2)
            $fence = '```'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '## Coverage (prodrive-windows)'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $fence
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "lines    $lineRate%  ($($cov.'lines-covered')/$($cov.'lines-valid'))"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "branches $branchRate%  ($($cov.'branches-covered')/$($cov.'branches-valid'))"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $fence
          }

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request' && hashFiles('coverage/cobertura-coverage.xml') != ''
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/cobertura-coverage.xml
          format: markdown
          output: both
          badge: true
          hide_complexity: true
          indicators: true

      - name: Add PR comment
        if: github.event_name == 'pull_request' && hashFiles('code-coverage-results.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: code-coverage-results.md
          header: windows-coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-coverage
          path: |
            coverage/
            TestResults/
          if-no-files-found: warn
